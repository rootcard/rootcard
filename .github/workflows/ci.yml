name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Vectors are up to date
        run: cargo run -p xtask -- vectors --check
      - name: Repository checks (pinned workflow dependencies, documents that name the version)
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p xtask -- repo-check
      - name: Fuzz targets (format and clippy; built with libFuzzer in the fuzz job)
        if: matrix.os == 'ubuntu-latest'
        working-directory: fuzz
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

  package:
    name: Packages build from their tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Crates (dry run)
        run: cargo publish --workspace --locked --dry-run
      - name: npm (dry run)
        working-directory: packages/rootcard
        run: npm publish --dry-run
      - name: Packages are reproducible (the same bytes from a second checkout with other file times)
        run: |
          umask 022
          out="$RUNNER_TEMP/repro"
          mkdir -p "$out/a" "$out/b"
          cargo package --workspace --exclude xtask --locked --no-verify
          cp target/package/*.crate "$out/a/"
          (cd packages/rootcard && npm pack --pack-destination "$out/a")
          git clone -q . "$out/copy"
          find "$out/copy" -path "$out/copy/.git" -prune -o -type f -exec touch -d 2001-02-03T04:05:06 {} +
          (cd "$out/copy" && CARGO_TARGET_DIR="$out/target" cargo package --workspace --exclude xtask --locked --no-verify)
          cp "$out"/target/package/*.crate "$out/b/"
          (cd "$out/copy/packages/rootcard" && npm pack --pack-destination "$out/b")
          (cd "$out/a" && sha256sum -- * | tee "$out/SHA256SUMS")
          (cd "$out/b" && sha256sum -c "$out/SHA256SUMS")

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95 branch
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets

  fuzz:
    name: Fuzz (${{ matrix.target }}, 2 min)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [json, text, log, log_signed, documents, host, links]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: nightly-2026-11-05
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seed corpus from spec/vectors
        working-directory: fuzz
        run: cargo run --locked --bin seeds
      - name: Fuzz for a fixed time (optimized, with overflow checks and debug assertions)
        working-directory: fuzz
        run: cargo fuzz run -O -a ${{ matrix.target }} -- -max_total_time=120 -rss_limit_mb=2048
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  js:
    name: JS (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Test (against the Rust-generated vectors in spec/vectors)
        working-directory: packages/rootcard
        run: npm test

  differential:
    name: Differential (JS core against the Rust core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Mutated vector inputs through both cores (a new seed each run; the log names it)
        run: cargo run --release --locked -p xtask -- differential --cases 100000 --seed ${{ github.run_id }}
      - name: Keep the disagreements
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential
          path: |
            target/differential/mismatches.jsonl
            target/differential/rust-panics.jsonl
          if-no-files-found: ignore

  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Development host (keytool.html talks to it)
        run: cargo build -p rootcard-host --example host
      - name: Playwright (only here; the npm package has no dependencies)
        working-directory: tests/browser
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Shared vectors and keytool.html in ${{ matrix.browser }}
        working-directory: tests/browser
        run: node run.mjs ${{ matrix.browser }}
