[workspace]
resolver = "3"
members = ["crates/rootcard", "crates/rootcard-cli", "crates/rootcard-host", "crates/xtask"]
# Its own workspace: libFuzzer and a nightly toolchain (fuzz/README.md).
exclude = ["fuzz"]

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/rootcard/rootcard"
homepage = "https://github.com/rootcard/rootcard"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rootcard = { path = "crates/rootcard", version = "0.3.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Argon2id and BLAKE2b are too slow unoptimized for the tests (m = 46 MiB).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
